[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "2.0.0"
description = "Production ML API for URL and email phishing detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siddhartha Venkatesan" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "prometheus-client>=0.21.0",
  "httpx>=0.27.0",
  "streamlit",
  "scikit-learn",
  "pandas",
  "numpy",
  "tldextract",
  "plotly",
  "joblib",
]

[project.urls]
Homepage = "https://github.com/siddharth3553-web/phishguard"
Repository = "https://github.com/siddharth3553-web/phishguard"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=phishguard --cov-report=term-missing --cov-fail-under=65"

[tool.coverage.run]
source = ["src/phishguard"]
omit = ["src/phishguard/api/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise RuntimeError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501", "E402", "I001"]
"apps/**" = ["E501"]
