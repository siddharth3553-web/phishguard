[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "AI-driven phishing detection (URL + email)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siddhartha Venkatesan" }]
dependencies = [
  "streamlit",
  "scikit-learn",
  "pandas",
  "numpy",
  "tldextract",
  "plotly",
  "joblib",
]

[project.urls]
Homepage = "https://github.com/siddharth3553-web/phishguard"
Repository = "https://github.com/siddharth3553-web/phishguard"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501", "E402", "I001"]
"apps/**" = ["E501"]
