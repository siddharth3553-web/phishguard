[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishguard"
version = "4.1.0"
description = "Employee report + analyst desk for phishing URL, email, and QR"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Siddhartha Venkatesan" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "prometheus-client>=0.21.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "skops>=0.10.0",
  "onnxruntime>=1.20.0",
  "skl2onnx>=1.18.0",
  "scikit-learn>=1.5.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "tldextract>=5.1.0",
  "bcrypt>=4.2.0",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.12",
  "opencv-python-headless>=4.10.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
]

[project.urls]
Homepage = "https://github.com/siddharth3553-web/phishguard"
Repository = "https://github.com/siddharth3553-web/phishguard"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phishguard"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=phishguard --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["src/phishguard"]
omit = ["src/phishguard/api/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise RuntimeError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501", "E402", "I001"]
"web/**" = ["E501"]
"alembic/**" = ["E501"]
